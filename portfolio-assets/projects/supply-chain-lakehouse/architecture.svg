<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Supply chain lakehouse architecture</title>
  <desc id="desc">Illustrative medallion flow from source data through Bronze, Silver and Gold layers to reporting.</desc>
  <rect width="1200" height="675" fill="#f5f8f6"/>
  <text x="64" y="88" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#16735e">PROJECT ARCHITECTURE</text>
  <text x="64" y="145" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#1c2e2a">Supply chain lakehouse</text>
  <text x="64" y="183" font-family="Arial, sans-serif" font-size="20" fill="#52645e">Illustrative medallion architecture</text>
  <path d="M225 350H275 M445 350H495 M665 350H715 M885 350H935" fill="none" stroke="#9aac9f" stroke-width="4" stroke-dasharray="8 7"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="55" y="285" width="170" height="130" rx="8" fill="#fff" stroke="#d7e1da"/>
    <text x="140" y="338" font-size="20" font-weight="700" fill="#243b35">Sources</text><text x="140" y="371" font-size="16" fill="#62756d">Supply chain data</text>
    <rect x="275" y="285" width="170" height="130" rx="8" fill="#fff" stroke="#d7e1da"/>
    <text x="360" y="338" font-size="20" font-weight="700" fill="#a65f3c">Bronze</text><text x="360" y="371" font-size="16" fill="#62756d">Raw data</text>
    <rect x="495" y="285" width="170" height="130" rx="8" fill="#fff" stroke="#d7e1da"/>
    <text x="580" y="338" font-size="20" font-weight="700" fill="#527487">Silver</text><text x="580" y="371" font-size="16" fill="#62756d">Cleaned data</text>
    <rect x="715" y="285" width="170" height="130" rx="8" fill="#fff" stroke="#d7e1da"/>
    <text x="800" y="338" font-size="20" font-weight="700" fill="#9c791b">Gold</text><text x="800" y="371" font-size="16" fill="#62756d">Curated data</text>
    <rect x="935" y="285" width="210" height="130" rx="8" fill="#173f35"/>
    <text x="1040" y="338" font-size="20" font-weight="700" fill="#fff">Consumption</text><text x="1040" y="371" font-size="16" fill="#cfe2d7">Analytics and reporting</text>
  </g>
  <text x="64" y="604" font-family="Arial, sans-serif" font-size="15" fill="#62756d">Illustrative only. Update to match the implemented project before publication.</text>
</svg>