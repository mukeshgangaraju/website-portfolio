    <rect x="892" y="285" width="256" height="130" rx="8" fill="#173f35"/>
    <text x="1020" y="338" font-size="20" font-weight="700" fill="#fff">Power BI</text><text x="1020" y="371" font-size="16" fill="#cfe2d7">Reporting</text>
