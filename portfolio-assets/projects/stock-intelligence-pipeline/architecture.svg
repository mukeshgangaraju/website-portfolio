  <text x="64" y="145" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#1c2e2a">Stock intelligence pipeline</text>
  <text x="64" y="183" font-family="Arial, sans-serif" font-size="20" fill="#52645e">Illustrative ingestion and reporting flow</text>
  <path d="M288 350H332 M568 350H612 M848 350H892" fill="none" stroke="#91aaa5" stroke-width="4" stroke-dasharray="8 7"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="52" y="285" width="236" height="130" rx="8" fill="#fff" stroke="#d7e1da"/>
